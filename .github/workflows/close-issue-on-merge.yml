name: PRマージ時にイシューをクローズ

# auto-merge.yml の GITHUB_TOKEN に issues: write がない場合のフォールバックとして、
# GitHub ネイティブの自動クローズが動作しない場合でも確実にイシューをクローズする。

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: PRの関連イシューをクローズ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body')

          echo "$PR_BODY" | python3 -c "
          import sys, re, os, subprocess

          body = sys.stdin.read()
          repo = os.environ.get('REPO', '')

          # Fixes/Closes/Resolves #N および owner/repo#N 形式を両方処理
          pattern = r'(?:fixes|closes|resolves)\s+(?:[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+)?#(\d+)'
          nums = list(dict.fromkeys(re.findall(pattern, body, re.IGNORECASE)))

          if not nums:
              print('No linked issues found in PR body.')
              sys.exit(0)

          for num in nums:
              print(f'Closing issue #{num}...')
              r = subprocess.run(
                  ['gh', 'issue', 'close', num, '--repo', repo],
                  capture_output=True, text=True
              )
              if r.returncode == 0:
                  print(f'Issue #{num} closed.')
              else:
                  print(f'Failed to close #{num}: {r.stderr.strip()}')
          "
