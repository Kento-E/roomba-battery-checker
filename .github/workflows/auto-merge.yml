name: Auto Merge on Approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: PR情報を表示
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          printf 'PR #%s: %s\n' "${PR_NUMBER}" "${PR_TITLE}"
          printf 'Base: %s\n' "${PR_BASE}"
          printf 'Head: %s\n' "${PR_HEAD}"
          printf 'Reviewer: %s\n' "${REVIEWER}"

      - name: 自動マージを実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          printf 'PR #%s が承認されました。自動マージを開始します...\n' "${PR_NUMBER}"
          
          # PRがDraftかどうかをチェック
          IS_DRAFT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isDraft --jq '.isDraft')
          
          if [ "$IS_DRAFT" = "true" ]; then
            echo "⚠️ このPRはDraft状態です。Draft状態のPRは自動マージされません。"
            echo "Ready for reviewに変更してから再度Approveしてください。"
            exit 0
          fi
          
          # PR状態を取得（ブロッキング条件のみチェック）
          if ! MERGE_STATE=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json mergeStateStatus --jq '.mergeStateStatus'); then
            echo "⚠️ PR状態を取得できませんでした。自動マージをスキップします。手動で確認してください。"
            exit 0
          fi
          echo "📋 PR状態: ${MERGE_STATE}"
          
          if [ "${MERGE_STATE}" = "DIRTY" ]; then
            echo "⚠️ マージコンフリクトが発生しています。コンフリクトを解消してください。"
            exit 0
          fi
          if [ "${MERGE_STATE}" = "BEHIND" ]; then
            echo "⚠️ ブランチがベースブランチより古くなっています。ブランチを更新してください。"
            exit 0
          fi
          
          # 自動マージを有効化（enablePullRequestAutoMerge ミューテーション経由）
          # gh pr merge --auto はPRがマージ可能な状態のとき mergePullRequest を呼ぶため、
          # .github/workflows/ 配下のファイルを含むPRでは workflows 権限が必要となりエラーになる。
          # enablePullRequestAutoMerge を直接呼ぶことで、実際のマージはGitHubの自動マージ機能に委ねる。
          # BLOCKEDの場合もauto-mergeを有効化する（ブロック要因が解消された時点でGitHubが自動マージを実行）
          # UNSTABLEの場合はチェックが実行中の可能性があるため最大5分待機してリトライする
          echo "🔄 自動マージを設定中..."
          if ! PR_NODE_ID=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.node_id' 2>&1); then
            printf '⚠️ PR #%s のNode ID取得に失敗しました（APIエラー）。自動マージをスキップします:\n' "${PR_NUMBER}"
            echo "${PR_NODE_ID}"
            exit 0
          fi
          if [ -z "${PR_NODE_ID}" ]; then
            printf '⚠️ PR #%s のNode IDが空でした。自動マージをスキップします。手動で確認してください。\n' "${PR_NUMBER}"
            exit 0
          fi

          MAX_WAIT_SECONDS=300
          RETRY_INTERVAL=30
          ELAPSED=0
          AUTO_MERGE_ENABLED=false

          while true; do
            if MERGE_RESULT=$(gh api graphql \
              -f query='mutation($pullRequestId:ID!,$mergeMethod:PullRequestMergeMethod!){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:$mergeMethod}){pullRequest{number title}}}' \
              -F pullRequestId="${PR_NODE_ID}" \
              -F mergeMethod="SQUASH" 2>&1); then
              AUTO_MERGE_ENABLED=true
              break
            fi

            # UNSTABLE以外のエラーは即座にスキップ
            if ! echo "${MERGE_RESULT}" | grep -q "unstable status"; then
              echo "⚠️ 自動マージをスキップしました:"
              echo "${MERGE_RESULT}"
              exit 0
            fi

            # UNSTABLEの場合: チェックが実行中かどうか確認
            if ! HEAD_SHA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid' 2>&1); then
              printf '⚠️ PR #%s のHEAD SHA取得に失敗しました。自動マージをスキップします:\n' "${PR_NUMBER}"
              echo "${HEAD_SHA}"
              exit 0
            fi
            if ! IN_PROGRESS_COUNT=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.status == "in_progress" or .status == "queued")] | length' 2>&1); then
              printf '⚠️ PR #%s のチェック実行状態の取得に失敗しました。自動マージをスキップします:\n' "${PR_NUMBER}"
              echo "${IN_PROGRESS_COUNT}"
              exit 0
            fi

            if [ "${IN_PROGRESS_COUNT}" = "0" ]; then
              printf '⚠️ PR #%s のすべてのチェックが完了していますが、PR状態がUNSTABLEのままです。必須チェックが失敗している可能性があります。\n' "${PR_NUMBER}"
              exit 0
            fi

            if [ "${ELAPSED}" -ge "${MAX_WAIT_SECONDS}" ]; then
              printf '⚠️ PR #%s のチェック完了待ちがタイムアウトしました（%d秒）。自動マージをスキップします。\n' "${PR_NUMBER}" "${ELAPSED}"
              exit 0
            fi

            printf '⏳ PR #%s のチェックが実行中のためUNSTABLEです。%d秒後にリトライ... (%d/%d秒経過)\n' "${PR_NUMBER}" "${RETRY_INTERVAL}" "${ELAPSED}" "${MAX_WAIT_SECONDS}"
            sleep "${RETRY_INTERVAL}"
            ELAPSED=$((ELAPSED + RETRY_INTERVAL))
          done

          if [ "${AUTO_MERGE_ENABLED}" = "true" ]; then
            printf '✅ PR #%s の自動マージが有効化されました\n' "${PR_NUMBER}"
            echo ""
            echo "📝 次のステップ:"
            echo "  1. すべてのステータスチェックが成功"
            echo "  2. → 自動的にSquash and Mergeが実行されます"
            echo "  3. マージ後、ブランチが自動削除されます（auto-delete-branch.ymlによる）"
          fi
