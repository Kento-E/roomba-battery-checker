name: Auto Merge on Approval

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'マージ対象のPR番号'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: PR情報を表示
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          printf 'イベント: %s\n' "${EVENT_NAME}"
          gh pr view "${PR_NUMBER}" --repo "${REPO}" --json number,title,baseRefName,headRefName --jq '"PR #\(.number): \(.title)\nBase: \(.baseRefName)\nHead: \(.headRefName)"'

      - name: 自動マージを実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          printf 'PR #%s の自動マージを開始します...\n' "${PR_NUMBER}"

          # PRがマージ済みかどうかをチェック
          PR_STATE=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json state --jq '.state')
          if [ "$PR_STATE" = "MERGED" ]; then
            echo "✅ このPRは既にマージ済みです。自動マージ処理をスキップします。"
            exit 0
          fi

          # PRがDraftかどうかをチェック
          IS_DRAFT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            echo "⚠️ このPRはDraft状態です。Draft状態のPRは自動マージされません。"
            echo "Ready for reviewに変更してから再度Approveしてください。"
            exit 0
          fi

          # gh pr merge --auto はチェック待ちなら auto-merge queue に積み、
          # 即マージ可能（CLEAN）なら直接マージする。
          # --delete-branch はフォークPRで失敗するため同一リポジトリの場合のみ付与する。
          IS_SAME_REPO=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isCrossRepository --jq '(.isCrossRepository | not)')
          if [ "${IS_SAME_REPO}" = "true" ]; then
            MERGE_CMD=(gh pr merge "${PR_NUMBER}" --repo "${REPO}" --squash --auto --delete-branch)
          else
            MERGE_CMD=(gh pr merge "${PR_NUMBER}" --repo "${REPO}" --squash --auto)
          fi

          if ! "${MERGE_CMD[@]}"; then
            echo "⚠️ 自動マージの設定に失敗しました。手動でマージしてください。"
            exit 1
          fi

          printf '✅ PR #%s の自動マージを有効化しました\n' "${PR_NUMBER}"
          echo "必須チェックが完了次第、自動的にマージされます"

