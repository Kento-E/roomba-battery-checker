name: Auto Merge on Approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  workflows: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: PR情報を表示
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          printf 'PR #%s: %s\n' "${PR_NUMBER}" "${PR_TITLE}"
          printf 'Base: %s\n' "${PR_BASE}"
          printf 'Head: %s\n' "${PR_HEAD}"
          printf 'Reviewer: %s\n' "${REVIEWER}"

      - name: 自動マージを実行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          printf 'PR #%s が承認されました。自動マージを開始します...\n' "${PR_NUMBER}"

          # PRがDraftかどうかをチェック
          IS_DRAFT=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isDraft --jq '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "⚠️ このPRはDraft状態です。Draft状態のPRは自動マージされません。"
            echo "Ready for reviewに変更してから再度Approveしてください。"
            exit 0
          fi

          # PR状態を確認
          echo "📋 PR状態を確認中..."
          gh pr view "${PR_NUMBER}" --repo "${REPO}" --json mergeable,mergeStateStatus --jq '.mergeable,.mergeStateStatus'

          # 自動マージを有効化
          # - PRがマージ可能な状態（CLEAN）のとき: 直接マージを実行（workflows権限が必要）
          # - PRがまだマージ可能でない状態（BLOCKED等）のとき: auto-mergeを有効化しGitHubが条件充足時にマージ
          echo "🔄 自動マージを設定中..."
          if ! gh pr merge "${PR_NUMBER}" --repo "${REPO}" --squash --auto; then
            echo "⚠️ 自動マージの設定に失敗しました。手動でマージしてください。"
            exit 0
          fi

          printf '✅ PR #%s の自動マージが有効化されました\n' "${PR_NUMBER}"
          echo ""
          echo "📝 次のステップ:"
          echo "  1. すべてのステータスチェックが成功"
          echo "  2. → 自動的にSquash and Mergeが実行されます"
          echo "  3. マージ後、ブランチが自動削除されます（auto-delete-branch.ymlによる）"

