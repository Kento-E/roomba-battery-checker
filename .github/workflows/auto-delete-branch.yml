name: Auto Delete Branch on Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    
    steps:
      - name: ブランチを削除
        uses: actions/github-script@v8
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const baseRef = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;
            
            console.log(`PR #${prNumber} がマージされました`);
            console.log(`ブランチ: ${headRef} -> ${baseRef}`);
            
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`
              });
              
              console.log(`✅ ブランチ '${headRef}' が正常に削除されました`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`ℹ️  ブランチ '${headRef}' は既に削除されているか、保護されています`);
              } else {
                console.error(`❌ ブランチ削除に失敗しました: ${error.message}`);
                throw error;
              }
            }
