name: Roombaバッテリーチェック

on:
  schedule:
    # スケジュール: 毎週月・水・金曜日の午前6時30分（JST）
    # UTC時刻: 21:30（前日の日・火・木曜日）
    # cron形式: '分 時 日 月 曜日' (UTC時刻、曜日: 0=日曜日)
    - cron: '30 21 * * 0,2,4'
  workflow_dispatch:  # 手動実行も可能
    inputs:
      force_notification:
        description: '100%でも通知する（疎通確認用）'
        required: false
        type: boolean
        default: false

jobs:
  check-battery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 依存関係をインストール
        run: npm install
      
      - name: Roombaバッテリー状態を確認
        env:
          ROOMBA_BLID: ${{ secrets.ROOMBA_BLID }}
          ROOMBA_PASSWORD: ${{ secrets.ROOMBA_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SEND_FROM: ${{ secrets.SEND_FROM }}
          SEND_TO: ${{ secrets.SEND_TO }}
          FORCE_NOTIFICATION: ${{ github.event.inputs.force_notification || 'false' }}
        run: npm run check-battery
