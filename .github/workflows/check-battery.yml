name: Roombaバッテリーチェック

on:
  schedule:
    # 毎週月・水・金曜日の午前6時30分（JST）に実行 (UTC 21:30 前日)
    - cron: '30 21 * * 0,2,4'
  workflow_dispatch:  # 手動実行も可能

jobs:
  check-battery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Roombaバッテリー状態を確認
        env:
          ROOMBA_IP: ${{ secrets.ROOMBA_IP }}
          ROOMBA_BLID: ${{ secrets.ROOMBA_BLID }}
          ROOMBA_PASSWORD: ${{ secrets.ROOMBA_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: python src/check_battery.py
